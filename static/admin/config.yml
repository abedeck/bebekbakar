backend:
  name: github
  repo: abedeck/bebekbakar
  branch: main
  base_url: https://decap-oauth.abednega.workers.dev
  auth_endpoint: auth

media_folder: "content/posts"
public_folder: ""

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false

      - label: "Thumbnail Image"
        name: "featured_image"       # <-- Disamakan dengan featured_image di Hugo
        widget: "image"
        required: false
        default: "cover.jpg"

      - label: "Author"
        name: "author"
        widget: "string"
        required: false

      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false

      - label: "Content"
        name: "body"
        widget: "markdown"