backend:
  name: github
  repo: abedeck/bebekbakar
  branch: main
  base_url: https://decap-oauth.abednega.workers.dev
  auth_endpoint: auth

# ========================================================
# PENTING: Untuk Page Bundle, kosongkan media_folder global
# ========================================================
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    
    # -------------------------------------------------------------
    # PENGATURAN PAGE BUNDLE
    # -------------------------------------------------------------
    path: "{{slug}}/index"     # Membuat folder: content/posts/{slug}/index.md
    media_folder: ""           # Upload foto LANGSUNG ke folder post aktif ({slug}/)
    public_folder: ""          # Output path relatif di markdown (misal: "foto.webp")

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false

      - label: "Thumbnail Image"
        name: "featured_image"
        widget: "image"
        required: false
        default: "cover.jpg"

      - label: "Author"
        name: "author"
        widget: "string"
        required: false

      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false

      - label: "Content"
        name: "body"
        widget: "markdown"
        # ========================================================
  # KOLEKSI KHUSUS IKLAN SIDEBAR
  # ========================================================
  - name: "ads"
    label: "Iklan Sidebar"
    folder: "content/ads"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Nama / Judul Iklan"
        name: "title"
        widget: "string"

      - label: "Status Aktif"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Matikan jika iklan ini sedang tidak ingin ditampilkan di sidebar"

      - label: "Gambar Banner Iklan"
        name: "image"
        widget: "image"
        hint: "Upload gambar banner iklan (disarankan rasio rasio tegak/persegi, misal 300x250px atau 300x600px)"

      - label: "Link Tujuan (URL)"
        name: "link"
        widget: "string"
        hint: "URL lengkap saat iklan diklik (contoh: https://tokopedia.com/namatoko atau /kontak)"

      - label: "Urutan Tampil"
        name: "weight"
        widget: "number"
        default: 1
        value_type: "int"
        hint: "Angka lebih kecil akan muncul lebih atas"