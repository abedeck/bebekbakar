backend:
  name: github
  repo: abedeck/bebekbakar
  branch: main
  base_url: https://decap-oauth.abednega.workers.dev
  auth_endpoint: auth

media_folder: "content/posts"
public_folder: ""

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false

      - label: "Thumbnail Image"
        name: "featured_image"       # <-- Disamakan dengan featured_image di Hugo
        widget: "image"
        required: false
        default: "cover.jpg"

      - label: "Author"
        name: "author"
        widget: "string"
        required: false

      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false

      - label: "Content"
        name: "body"
        widget: "markdown"
 # ========================================================
      # BLOK GALERI BENTO GRID DI SINI
      # ========================================================
  - name: "posts"
    label: "Artikel & Kegiatan"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Post", name: "title", widget: "string" }
      - { label: "Tanggal Published", name: "date", widget: "datetime" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text", required: false }
      - { label: "Thumbnail Image", name: "featured_image", widget: "image", required: false }

      # ========================================================
      # TAMBAHKAN BLOK GALERI BENTO GRID DI SINI
      # ========================================================
      - label: "Galeri Foto Bento Grid"
        name: "bento_gallery"
        widget: "list"
        required: false
        hint: "Tambahkan foto-foto kegiatan dari Google Drive di sini"
        fields:
          - label: "ID File Google Drive"
            name: "drive_id"
            widget: "string"
            hint: "Ambil ID acak dari link Drive (contoh: 1ABC123xyz...)"
          
          - label: "Keterangan Foto (Alt Text)"
            name: "alt"
            widget: "string"
            required: false
            
          - label: "Ukuran Layout Foto"
            name: "size"
            widget: "select"
            default: "normal"
            options:
              - { label: "Standar / Normal (1x1)", value: "normal" }
              - { label: "Melebar / Landscape (2x1)", value: "wide" }
              - { label: "Tinggi / Portrait (1x2)", value: "tall" }
              - { label: "Besar Utama (2x2)", value: "big" }
      # ========================================================

      # Field isi artikel Markdown biasa
      - { label: "Isi Teks / Konten", name: "body", widget: "markdown" }