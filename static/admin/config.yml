backend:
  name: github
  repo: abedeck/bebekbakar
  branch: main
  base_url: https://decap-oauth.abednega.workers.dev
  auth_endpoint: auth

# ========================================================
# PENTING: Untuk Page Bundle, kosongkan media_folder global
# ========================================================
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    
    # -------------------------------------------------------------
    # PENGATURAN PAGE BUNDLE
    # -------------------------------------------------------------
    path: "{{slug}}/index"     # Membuat folder: content/posts/{slug}/index.md
    media_folder: ""           # Upload foto LANGSUNG ke folder post aktif ({slug}/)
    public_folder: ""          # Output path relatif di markdown (misal: "foto.webp")

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false

      - label: "Thumbnail Image"
        name: "featured_image"
        widget: "image"
        required: false
        default: "cover.jpg"

      - label: "Author"
        name: "author"
        widget: "string"
        required: false

      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false

      - label: "Content"
        name: "body"
        widget: "markdown"