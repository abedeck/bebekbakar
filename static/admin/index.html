<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    
    <!-- Library Kompresi Gambar (Sangat Ringan ~28KB) -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
  </head>
  <body>
    <!-- Script Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- ======================================================== -->
    <!-- 1. AUTOMATIC WEBP CONVERTER (PRE-UPLOAD INTERCEPTOR)     -->
    <!-- ======================================================== -->
    <script>
      CMS.registerEventListener({
        name: 'preUpload',
        handler: async ({ file }) => {
          // Jika yang di-upload bukan file gambar, langsung lewati
          if (!file || !file.type.startsWith('image/')) return { file };

          // Konfigurasi Kompresi WebP
          const options = {
            maxSizeMB: 0.8,          // Maksimal ukuran file: 800 KB
            maxWidthOrHeight: 1200,  // Dimensi maksimal 1200px (Sangat pas untuk Bento Grid)
            useWebWorker: true,      // Menggunakan background process agar browser tidak lag
            fileType: 'image/webp'   // Paksa ubah format ke WebP
          };

          try {
            // Proses kompresi & convert langsung di browser user
            const compressedBlob = await imageCompression(file, options);
            
            // Ubah ekstensi nama file asli menjadi .webp
            const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            const newFileName = `${cleanName}.webp`;
            
            // Buat file baru berformat WebP
            const webpFile = new File([compressedBlob], newFileName, { type: 'image/webp' });
            
            return { file: webpFile };
          } catch (error) {
            console.error("Gagal mengompres gambar, mengunggah file asli:", error);
            return { file };
          }
        },
      });
    </script>

    <!-- ======================================================== -->
    <!-- 2. COMPONENT BENTO GRID GALLERY (GUI VISUAL UNTUK NORMIES)-->
    <!-- ======================================================== -->
    <script>
      CMS.registerEditorComponent({
        id: "bento-gallery",
        label: "🖼️ Bento Gallery (Upload Foto)",
        
        // Form Visual untuk Editor Decap CMS
        fields: [
          {
            label: "Daftar Foto Kegiatan",
            name: "images",
            widget: "list",
            summary: "{{fields.alt}} ({{fields.size}})",
            fields: [
              {
                label: "Pilih / Upload Foto",
                name: "src",
                widget: "image",
                choose_url: true,
                hint: "Bisa upload dari HP/Laptop (otomatis di-convert ke WebP) atau tempel URL"
              },
              {
                label: "Ukuran Layout Foto",
                name: "size",
                widget: "select",
                default: "normal",
                options: [
                  { label: "⬛ Standar / Normal (1x1)", value: "normal" },
                  { label: "▬ Melebar / Landscape (2x1)", value: "wide" },
                  { label: "▮ Tinggi / Portrait (1x2)", value: "tall" },
                  { label: "██ Besar Utama (2x2)", value: "big" }
                ]
              },
              {
                label: "Keterangan Foto (Alt/Caption)",
                name: "alt",
                widget: "string",
                required: false
              }
            ]
          }
        ],

        // Pattern Regex Shortcode Hugo
        pattern: /^\{\{<\s*bento\s*>\}\}([\s\S]*?)\{\{<\s*\/bento\s*>\}\}$/,

        // Membaca Kembali Data Shortcode saat Edit Post
        fromBlock: function(match) {
          const innerContent = match[1] || "";
          const itemRegex = /\{\{<\s*bento-item\s+src="([^"]+)"(?:\s+size="([^"]+)")?(?:\s+alt="([^"]+)")?\s*>\}\}/g;
          const images = [];
          let itemMatch;

          while ((itemMatch = itemRegex.exec(innerContent)) !== null) {
            images.push({
              src: itemMatch[1],
              size: itemMatch[2] || "normal",
              alt: itemMatch[3] || ""
            });
          }

          return { images: images };
        },

        // Merender Input Visual menjadi Shortcode Hugo
        toBlock: function(obj) {
          if (!obj.images || !obj.images.length) return "";
          
          const itemsHtml = obj.images.map(img => {
            return `  {{< bento-item src="${img.src || ''}" size="${img.size || 'normal'}" alt="${img.alt || ''}" >}}`;
          }).join("\n");

          return `{{< bento >}}\n${itemsHtml}\n{{< /bento >}}`;
        },

        // Tampilan Card Preview di Admin Dashboard
        toPreview: function(obj) {
          const count = obj.images ? obj.images.length : 0;
          return `<div style="padding: 12px; border: 2px dashed #0284c7; border-radius: 8px; background: #f0f9ff; color: #0369a1; font-weight: bold;">
            🖼️ Bento Gallery (${count} foto tersimpan & siap di-publish)
          </div>`;
        }
      });
    </script>
  </body>
</html>
