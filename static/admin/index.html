<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- 1. Script Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- 2. Library Kompresi Gambar -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>

    <script>
      // ========================================================
      // 1. AUTOMATIC WEBP CONVERTER UNTUK DECAP CMS V3 (preSave)
      // ========================================================
      try {
        if (typeof CMS !== 'undefined') {
          CMS.registerEventListener({
            name: 'preSave',
            handler: async ({ entry }) => {
              // Fungsi kompresi gambar
              const compressFn = window.imageCompression;
              if (!compressFn) return entry.get('data');

              const options = {
                maxSizeMB: 0.8,
                maxWidthOrHeight: 1200,
                useWebWorker: true,
                fileType: 'image/webp'
              };

              // Ambil semua file media yang baru di-upload dalam sesi ini
              const mediaFiles = entry.get('mediaFiles');
              if (!mediaFiles || !mediaFiles.size) return entry.get('data');

              // Dapatkan data entry
              let data = entry.get('data');

              // Lakukan kompresi untuk setiap file gambar
              for (const fileObj of mediaFiles.toArray()) {
                const file = fileObj.file;
                if (file && file.type && file.type.startsWith('image/')) {
                  try {
                    const compressedBlob = await compressFn(file, options);
                    const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    const newFileName = `${cleanName}.webp`;
                    
                    // Ganti file dengan versi WebP
                    fileObj.file = new File([compressedBlob], newFileName, { type: 'image/webp' });
                  } catch (err) {
                    console.error("Gagal kompres gambar:", err);
                  }
                }
              }

              return data;
            },
          });
        }
      } catch (e) {
        console.error("Error registerEventListener:", e);
      }

      // ========================================================
      // 2. COMPONENT BENTO GALLERY (GUI FOR NORMIES)
      // ========================================================
      try {
        if (typeof CMS !== 'undefined') {
          CMS.registerEditorComponent({
            id: "bento-gallery",
            label: "🖼️ Bento Gallery (Upload Foto)",
            
            fields: [
              {
                label: "Daftar Foto Kegiatan",
                name: "images",
                widget: "list",
                summary: "{{fields.alt}} ({{fields.size}})",
                fields: [
                  {
                    label: "Pilih / Upload Foto",
                    name: "src",
                    widget: "image",
                    choose_url: true,
                    hint: "Bisa upload dari HP/Laptop (otomatis WebP saat Save) atau tempel URL"
                  },
                  {
                    label: "Ukuran Layout Foto",
                    name: "size",
                    widget: "select",
                    default: "normal",
                    options: [
                      { label: "⬛ Standar / Normal (1x1)", value: "normal" },
                      { label: "▬ Melebar / Landscape (2x1)", value: "wide" },
                      { label: "▮ Tinggi / Portrait (1x2)", value: "tall" },
                      { label: "██ Besar Utama (2x2)", value: "big" }
                    ]
                  },
                  {
                    label: "Keterangan Foto (Alt/Caption)",
                    name: "alt",
                    widget: "string",
                    required: false
                  }
                ]
              }
            ],

            pattern: /^\{\{<\s*bento\s*>\}\}([\s\S]*?)\{\{<\s*\/bento\s*>\}\}$/,

            fromBlock: function(match) {
              const innerContent = match[1] || "";
              const itemRegex = /\{\{<\s*bento-item\s+src="([^"]+)"(?:\s+size="([^"]+)")?(?:\s+alt="([^"]+)")?\s*>\}\}/g;
              const images = [];
              let itemMatch;

              while ((itemMatch = itemRegex.exec(innerContent)) !== null) {
                images.push({
                  src: itemMatch[1],
                  size: itemMatch[2] || "normal",
                  alt: itemMatch[3] || ""
                });
              }

              return { images: images };
            },

            toBlock: function(obj) {
              if (!obj.images || !obj.images.length) return "";
              
              const itemsHtml = obj.images.map(img => {
                return `  {{< bento-item src="${img.src || ''}" size="${img.size || 'normal'}" alt="${img.alt || ''}" >}}`;
              }).join("\n");

              return `{{< bento >}}\n${itemsHtml}\n{{< /bento >}}`;
            },

            toPreview: function(obj) {
              const count = obj.images ? obj.images.length : 0;
              return `<div style="padding: 12px; border: 2px dashed #0284c7; border-radius: 8px; background: #f0f9ff; color: #0369a1; font-weight: bold;">
                🖼️ Bento Gallery (${count} foto tersimpan)
              </div>`;
            }
          });
        }
      } catch (e) {
        console.error("Error registerEditorComponent:", e);
      }
    </script>
  </body>
</html>
