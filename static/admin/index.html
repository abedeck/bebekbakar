<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Script Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- CUSTOM COMPONENT BENTO ITEM -->
    <script>
      CMS.registerEditorComponent({
        // ID internal komponen
        id: "bento-item",
        // Nama yang muncul di menu tombol "+" Decap CMS
        label: "Bento Gallery Item",
        // Input form yang muncul saat klik tombol
        fields: [
          {
            name: "src",
            label: "URL Foto (Imgur/Direct Link)",
            widget: "string",
            hint: "Contoh: https://i.imgur.com/xyz123.jpg"
          },
          {
            name: "size",
            label: "Ukuran Grid",
            widget: "select",
            default: "normal",
            options: [
              { label: "Standar / Normal (1x1)", value: "normal" },
              { label: "Melebar / Landscape (2x1)", value: "wide" },
              { label: "Tinggi / Portrait (1x2)", value: "tall" },
              { label: "Besar Utama (2x2)", value: "big" }
            ]
          },
          {
            name: "alt",
            label: "Keterangan Foto (Alt / Caption)",
            widget: "string",
            required: false
          }
        ],
        // Regex untuk mengenali shortcode di dalam markdown
        pattern: /^\{\{<\s*bento-item\s+src="([^"]+)"(?:\s+size="([^"]+)")?(?:\s+alt="([^"]+)")?\s*>\}\}$/,
        
        // Fungsi membaca isi shortcode saat diedit kembali
        fromBlock: function(match) {
          return {
            src: match[1],
            size: match[2] || "normal",
            alt: match[3] || ""
          };
        },
        
        // Fungsi membuat sintaks shortcode Hugo
        toBlock: function(obj) {
          return `{{< bento-item src="${obj.src || ''}" size="${obj.size || 'normal'}" alt="${obj.alt || ''}" >}}`;
        },
        
        // Tampilan preview sederhana di dalam editor Decap CMS
        toPreview: function(obj) {
          return `<div style="padding: 8px; border: 1px dashed #ccc; margin: 4px 0; background: #f9f9f9;">
            📷 <strong>Bento Item (${obj.size || 'normal'})</strong>: ${obj.src || 'No URL'}
          </div>`;
        }
      });
    </script>
  </body>
</html>
